# =======================================================
# FoodieExpress Application Configuration
# =======================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=FoodieExpress

# MySQL Database Configuration
# Replace 'root' and 'rootpassword' with your actual MySQL credentials
spring.datasource.url=jdbc:mysql://localhost:3306/foodie_express_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate & JPA Configuration
# 'update': automatically creates or updates database tables based on Java Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =======================================================
# JWT Security Configuration
# =======================================================
# 256-bit secure signing key
