<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodieExpress - Create Account</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div id="navbarContainer"></div>

  <main class="container">
    <div class="auth-box">
      <h2>Create an Account 🍕</h2>
      <p>Sign up to start ordering tasty food delivered in 30 minutes.</p>

      <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="regName" placeholder="e.g. Priya Sharma" required>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="regEmail" placeholder="e.g. priya@example.com" required>
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="regPhone" placeholder="e.g. 9876543210" required>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPassword" placeholder="Minimum 6 characters" required minlength="6">
        </div>

        <div class="form-group">
          <label>Account Type</label>
          <select id="regRole">
            <option value="CUSTOMER">Customer (Order Food)</option>
            <option value="RESTAURANT_OWNER">Restaurant Partner</option>
            <option value="DELIVERY_PARTNER">Delivery Partner</option>
          </select>
        </div>

        <button type="submit" class="btn-primary">Sign Up</button>
      </form>

      <div style="text-align: center; margin-top: 1.8rem; font-size: 0.92rem; color: var(--dark-light);">
        Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 700;">Sign In</a>
      </div>
    </div>
  </main>

  <div id="footerContainer"></div>

  <script src="js/app.js"></script>
  <script>
    renderHeader();
    renderFooter();

    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const password = document.getElementById('regPassword').value;
      const role = document.getElementById('regRole').value;

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, phone, password, role })
        });

        const data = await response.json();

        if (response.ok && data.token) {
          const newUser = {
            id: data.id,
            name: data.name,
            email: data.email,
            phone: data.phone,
            role: data.role,
            address: "123 Green Valley Road, Bangalore"
          };
          setAuthSession(newUser, data.token);
          showToast("Account created successfully with encrypted security! 🎉");
          setTimeout(() => {
            window.location.href = "index.html";
          }, 1000);
        } else {
          showToast("❌ " + (data.message || "Registration failed"));
        }
      } catch (err) {
        // Fallback for offline demo
        const newUser = {
          id: Date.now(),
          name: name,
          email: email,
          phone: phone,
          role: role,
          address: "123 Green Valley Road, Bangalore"
        };
        setAuthSession(newUser, "demo_jwt_token_123");
        showToast("Account created (Offline Mode) 🎉");
        setTimeout(() => {
          window.location.href = "index.html";
        }, 1000);
      }
    }
  </script>
</body>
</html>
