# =======================================================
# FoodieExpress - Production Configuration Profile
# =======================================================

# Server
server.port=${PORT:8080}
spring.application.name=FoodieExpress

# Production Database via Environment Variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/foodie_express_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rootpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Razorpay Test / Production Keys
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_51a2b3c4d5e6f7}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:99a8b7c6d5e4f3a2b1c0d9e8}
razorpay.currency=INR
razorpay.company.name=FoodieExpress

