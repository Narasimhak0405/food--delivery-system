version: '3.8'

services:
  # MySQL Database Service
  mysql-db:
    image: mysql:8.0
    container_name: foodie-mysql
    restart: always
    environment:
      MYSQL_DATABASE: foodie_express_db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database_setup.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Spring Boot Backend & Frontend Service
  foodie-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foodie-app
    restart: always
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql-db:3306/foodie_express_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      RAZORPAY_KEY_ID: rzp_test_51a2b3c4d5e6f7
      RAZORPAY_KEY_SECRET: 99a8b7c6d5e4f3a2b1c0d9e8
    ports:
      - "8080:8080"

volumes:
  db_data:

