<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodieExpress - Restaurant Menu</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div id="navbarContainer"></div>

  <main class="menu-container">
    <!-- Restaurant Header Card -->
    <div id="restaurantHeader" class="restaurant-detail-header">
      <!-- Dynamically filled -->
    </div>

    <!-- Veg/Non-Veg Filter Bar -->
    <div style="background: white; padding: 0.8rem 1.4rem; border-radius: var(--radius-md); box-shadow: var(--shadow-sm); display: flex; gap: 1rem; align-items: center; margin-bottom: 1.5rem;">
      <span style="font-weight: 700; font-size: 0.92rem;">Filter Menu:</span>
      <button class="add-btn" style="margin: 0;" onclick="filterDishType('ALL')">All Dishes</button>
      <button class="add-btn" style="margin: 0; color: var(--veg-green); border-color: var(--veg-green);" onclick="filterDishType('VEG')">🟢 Veg Only</button>
      <button class="add-btn" style="margin: 0; color: var(--nonveg-red); border-color: var(--nonveg-red);" onclick="filterDishType('NONVEG')">🔴 Non-Veg Only</button>
    </div>

    <!-- Dishes List -->
    <div id="dishList">
      <!-- Dynamically populated -->
    </div>
  </main>

  <div id="footerContainer"></div>

  <script src="js/app.js"></script>
  <script>
    renderHeader();
    renderFooter();

    let currentRestaurant = null;
    let restaurantDishes = [];
    let displayedDishes = [];

    async function loadMenu() {
      const urlParams = new URLSearchParams(window.location.search);
      const restId = parseInt(urlParams.get('id')) || 1;

      // Find restaurant
      currentRestaurant = DEFAULT_RESTAURANTS.find(r => r.id === restId) || DEFAULT_RESTAURANTS[0];

      // Fetch dishes (REST API with fallback)
      try {
        const res = await fetch(`/api/restaurants/${restId}/menu`);
        if (res.ok) {
          const data = await res.json();
          restaurantDishes = (data && data.length > 0) ? data : DEFAULT_FOOD_ITEMS.filter(f => f.restaurantId === restId);
        } else {
          restaurantDishes = DEFAULT_FOOD_ITEMS.filter(f => f.restaurantId === restId);
        }
      } catch (e) {
        restaurantDishes = DEFAULT_FOOD_ITEMS.filter(f => f.restaurantId === restId);
      }

      if (restaurantDishes.length === 0) {
        // Fallback to sample items if this specific restaurant had none
        restaurantDishes = DEFAULT_FOOD_ITEMS.slice(0, 4);
      }

      displayedDishes = [...restaurantDishes];
      renderHeaderCard();
      renderDishes();
    }

    function renderHeaderCard() {
      const header = document.getElementById('restaurantHeader');
      header.innerHTML = `
        <div>
          <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 0.4rem;">${currentRestaurant.name}</h1>
          <p style="color: var(--dark-light); font-size: 0.95rem; margin-bottom: 0.6rem;">${currentRestaurant.cuisineType}</p>
          <p style="color: #747d8c; font-size: 0.85rem;">📍 ${currentRestaurant.address}, ${currentRestaurant.city}</p>
        </div>
        <div style="text-align: right;">
          <div class="rating-badge" style="font-size: 1.1rem; padding: 6px 12px; display: inline-flex;">
            ★ ${currentRestaurant.rating}
          </div>
          <div style="font-size: 0.85rem; font-weight: 600; color: var(--dark-light); margin-top: 0.4rem;">
            ⏳ ${currentRestaurant.deliveryTimeMins} mins delivery
          </div>
        </div>
      `;
    }

    function renderDishes() {
      const list = document.getElementById('dishList');
      list.innerHTML = '';
      const cart = getCart();

      displayedDishes.forEach(dish => {
        const inCart = cart.find(ci => ci.id === dish.id);
        const row = document.createElement('div');
        row.className = 'menu-item-row';
        row.innerHTML = `
          <div class="item-info">
            <div class="${dish.isVeg ? 'veg-icon' : 'nonveg-icon'}">
              <div class="circle"></div>
            </div>
            <h3 class="item-name">${dish.name}</h3>
            <div class="item-price">₹${dish.price}</div>
            <p class="item-desc">${dish.description || 'Delicious freshly prepared authentic dish with rich herbs and condiments.'}</p>
          </div>

          <div class="item-action">
            <img src="${dish.imageUrl || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300'}" alt="${dish.name}">
            ${inCart ? `
              <div class="qty-counter">
                <button onclick="handleQtyChange(${dish.id}, -1)">−</button>
                <span>${inCart.quantity}</span>
                <button onclick="handleQtyChange(${dish.id}, 1)">+</button>
              </div>
            ` : `
              <button class="add-btn" onclick="handleAddToCart(${dish.id})">ADD</button>
            `}
          </div>
        `;
        list.appendChild(row);
      });
    }

    function handleAddToCart(dishId) {
      const dish = restaurantDishes.find(d => d.id === dishId);
      if (dish) {
        addToCart(dish);
        renderDishes();
      }
    }

    function handleQtyChange(dishId, delta) {
      updateCartQuantity(dishId, delta);
      renderDishes();
    }

    function filterDishType(type) {
      if (type === 'ALL') displayedDishes = [...restaurantDishes];
      if (type === 'VEG') displayedDishes = restaurantDishes.filter(d => d.isVeg);
      if (type === 'NONVEG') displayedDishes = restaurantDishes.filter(d => !d.isVeg);
      renderDishes();
    }

    loadMenu();
  </script>
</body>
</html>
