<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodieExpress - Sign In</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div id="navbarContainer"></div>

  <main class="container">
    <div class="auth-box">
      <h2>Welcome Back! 👋</h2>
      <p>Log in to access your orders, saved addresses & special offers.</p>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="loginEmail" placeholder="e.g. rahul@gmail.com" required value="rahul@gmail.com">
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="Enter your password" required value="password123">
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.88rem;">
          <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
            <input type="checkbox" checked style="width: auto;"> Remember me
          </label>
          <a href="#" style="color: var(--primary); font-weight: 600;">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-primary">Sign In</button>
      </form>

      <div style="text-align: center; margin-top: 1.8rem; font-size: 0.92rem; color: var(--dark-light);">
        Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 700;">Create an account</a>
      </div>
    </div>
  </main>

  <div id="footerContainer"></div>

  <script src="js/app.js"></script>
  <script>
    renderHeader();
    renderFooter();

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok && data.token) {
          const user = {
            id: data.id,
            name: data.name,
            email: data.email,
            phone: data.phone,
            role: data.role,
            address: "Indiranagar, Bangalore"
          };
          setAuthSession(user, data.token);
          showToast("Signed in securely! Redirecting...");
          setTimeout(() => {
            window.location.href = "index.html";
          }, 800);
        } else {
          showToast("❌ " + (data.message || "Invalid credentials"));
        }
      } catch (err) {
        // Fallback for offline demo
        const user = {
          id: 2,
          name: email.split('@')[0].toUpperCase(),
          email: email,
          phone: "9811122233",
          address: "Flat 402, Sunshine Heights, Indiranagar, Bangalore"
        };
        setAuthSession(user, "demo_jwt_token_123");
        showToast("Signed in (Offline Mode). Redirecting...");
        setTimeout(() => {
          window.location.href = "index.html";
        }, 800);
      }
    }
  </script>
</body>
</html>
